<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accents Gradients -->
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Inner step card gradient -->
    <linearGradient id="step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 14px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #F8FAFC; }
    .card-phase { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #F8FAFC; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38BDF8; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="780" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle Grid Pattern for High-Tech feel -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="780" />
    <line x1="200" y1="0" x2="200" y2="780" />
    <line x1="340" y1="0" x2="340" y2="780" />
    <line x1="480" y1="0" x2="480" y2="780" />
    <line x1="620" y1="0" x2="620" y2="780" />
    <line x1="760" y1="0" x2="760" y2="780" />
    <line x1="900" y1="0" x2="900" y2="780" />
    <line x1="1040" y1="0" x2="1040" y2="780" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="0" y1="660" x2="1200" y2="660" />
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 45)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#accent-blue)" filter="url(#glow-blue)" opacity="0.8" />
    <path d="M14 16h18M14 23h18M14 30h12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="60" y="24" class="title" font-size="24">VSL-VietnameseSignLanguage Pipeline Architecture</text>
    <text x="60" y="44" class="subtitle">Sơ đồ tổng quan quy trình thu thập, tiền xử lý video và trích xuất 76 điểm đặc trưng 3D keypoints</text>
  </g>

  <!-- Connector Line between Phase 1 and 2 -->
  <path d="M 405 400 L 445 400" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="445,400 435,395 435,405" fill="#38BDF8" />

  <!-- Connector Line between Phase 2 and 3 -->
  <path d="M 775 400 L 815 400" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="815,400 805,395 805,405" fill="#A855F7" />

  <!-- ==================== PHASE 1: DATA COLLECTION ==================== -->
  <g transform="translate(50, 120)" filter="url(#shadow)">
    <!-- Column Card Background -->
    <rect width="355" height="560" rx="16" fill="url(#card-grad-1)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Phase Header -->
    <rect x="24" y="24" width="70" height="22" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="36" y="39" class="card-phase" fill="#38BDF8">GIAI ĐOẠN 1</text>
    
    <text x="24" y="74" class="card-title">Thu Thập &amp; Tổ Chức Dữ Liệu</text>
    <text x="24" y="94" class="step-desc">Gộp phân đoạn splits, phân loại gloss và chia signer</text>

    <!-- Step 1.1 -->
    <g transform="translate(20, 115)">
      <rect width="315" height="85" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#0369A1" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="48" y="28" class="step-title">Gộp Nhiều Phân Đoạn (Splits)</text>
      <text x="20" y="55" class="step-desc">• Quét các thư mục split_1, split_2...</text>
      <text x="20" y="72" class="step-desc">• Hợp nhất metadata JSON (front, left, right)</text>
    </g>

    <!-- Step 1.2 -->
    <g transform="translate(20, 215)">
      <rect width="315" height="85" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#0369A1" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="48" y="28" class="step-title">Phân Loại Video Theo Gloss</text>
      <text x="20" y="55" class="step-desc">• Đọc file front_view.json đã gộp</text>
      <text x="20" y="72" class="step-desc">• Gom video vào thư mục tên từ vựng (400+ gloss)</text>
    </g>

    <!-- Step 1.3 -->
    <g transform="translate(20, 315)">
      <rect width="315" height="95" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#0369A1" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="48" y="28" class="step-title">Chia Tập Train/Test Theo Signer</text>
      <text x="20" y="55" class="step-desc">• Tỷ lệ phân bổ: ~80% Train / ~20% Test</text>
      <text x="20" y="72" class="step-desc">• Đánh giá Unseen-Signer (người ký độc lập)</text>
      <text x="20" y="89" class="step-desc">• Xuất bảng global_signer_split.tsv</text>
    </g>

    <!-- Output Box -->
    <g transform="translate(20, 430)">
      <rect width="315" height="105" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
      <text x="16" y="26" class="step-title" fill="#38BDF8">Đầu Ra Giai Đoạn 1:</text>
      <text x="16" y="50" class="code-pill">data/signer_splited/train/</text>
      <text x="16" y="70" class="code-pill">data/signer_splited/test/</text>
      <text x="16" y="90" class="code-pill">global_signer_split.tsv</text>
    </g>
  </g>

  <!-- ==================== PHASE 2: PREPROCESSING ==================== -->
  <g transform="translate(425, 120)" filter="url(#shadow)">
    <!-- Column Card Background -->
    <rect width="355" height="560" rx="16" fill="url(#card-grad-2)" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Phase Header -->
    <rect x="24" y="24" width="70" height="22" rx="6" fill="#7E22CE" fill-opacity="0.2" stroke="#A855F7" stroke-width="1" />
    <text x="36" y="39" class="card-phase" fill="#C084FC">GIAI ĐOẠN 2</text>
    
    <text x="24" y="74" class="card-title">Tiền Xử Lý Video (TBL &amp; Crop)</text>
    <text x="24" y="94" class="step-desc">Định vị thời gian active, cắt ROI và nén chuẩn 224x224</text>

    <!-- Step 2.1 -->
    <g transform="translate(20, 115)">
      <rect width="315" height="95" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#7E22CE" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="48" y="28" class="step-title">Pass 1: Định Vị Biên Thời Gian (TBL)</text>
      <text x="20" y="52" class="step-desc">• Tính góc khuỷu tay: Góc &lt; 160° là active</text>
      <text x="20" y="69" class="step-desc">• Gộp đoạn chuyển động gần nhau: max_gap = 0.8s</text>
      <text x="20" y="86" class="step-desc">• Loại bỏ nhiễu tĩnh &amp; lọc thời lượng: t_min = 0.67s</text>
    </g>

    <!-- Step 2.2 -->
    <g transform="translate(20, 225)">
      <rect width="315" height="95" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#7E22CE" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="48" y="28" class="step-title">Pass 2: Cắt Không Gian (Spatial Crop)</text>
      <text x="20" y="52" class="step-desc">• Bounding Box: box_size = shoulder_width × 3.6</text>
      <text x="20" y="69" class="step-desc">• Căn giữa mũi, padding biên thời gian ±0.4s</text>
      <text x="20" y="86" class="step-desc">• Resize đồng nhất về kích thước chuẩn 224×224 px</text>
    </g>

    <!-- Step 2.3 -->
    <g transform="translate(20, 335)">
      <rect width="315" height="75" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#7E22CE" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="48" y="28" class="step-title">Trích Xuất Metadata Sau Tiền Xử Lý</text>
      <text x="20" y="52" class="step-desc">• Quét video 224x224 thành phẩm bằng OpenCV</text>
      <text x="20" y="69" class="step-desc">• Trích xuất: FPS, Frames thực, Duration thực</text>
    </g>

    <!-- Output Box -->
    <g transform="translate(20, 430)">
      <rect width="315" height="105" rx="10" fill="#0F172A" stroke="#7E22CE" stroke-width="1.2" />
      <text x="16" y="26" class="step-title" fill="#C084FC">Đầu Ra Giai Đoạn 2:</text>
      <text x="16" y="50" class="code-pill" fill="#C084FC">preprocessed_224/{gloss}/*.mp4</text>
      <text x="16" y="70" class="step-desc">Độ phân giải vuông: 224 × 224 px</text>
      <text x="16" y="90" class="code-pill" fill="#C084FC">preprocessed_vsl_metadata.json</text>
    </g>
  </g>

  <!-- ==================== PHASE 3: KEYPOINTS EXTRACTION ==================== -->
  <g transform="translate(795, 120)" filter="url(#shadow)">
    <!-- Column Card Background -->
    <rect width="355" height="560" rx="16" fill="url(#card-grad-3)" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Phase Header -->
    <rect x="24" y="24" width="70" height="22" rx="6" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1" />
    <text x="36" y="39" class="card-phase" fill="#34D399">GIAI ĐOẠN 3</text>
    
    <text x="24" y="74" class="card-title">Trích Xuất 76 Keypoints 3D</text>
    <text x="24" y="94" class="step-desc">MediaPipe Holistic, chuẩn hóa và phân tích thống kê</text>

    <!-- Step 3.1 -->
    <g transform="translate(20, 115)">
      <rect width="315" height="95" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#047857" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="48" y="28" class="step-title">MediaPipe Holistic Landmark Extractor</text>
      <text x="20" y="52" class="step-desc">• 34 Body: 33 Pose landmarks + 1 "neck" tổng hợp</text>
      <text x="20" y="69" class="step-desc">• 42 Hands: 21 điểm bàn tay trái + 21 tay phải</text>
      <text x="20" y="86" class="step-desc">• Tọa độ không gian 3D đầy đủ: (x, y, z)</text>
    </g>

    <!-- Step 3.2 -->
    <g transform="translate(20, 225)">
      <rect width="315" height="95" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#047857" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="48" y="28" class="step-title">Chuẩn Hóa Tọa Độ (Normalization)</text>
      <text x="20" y="52" class="step-desc">• Body Norm: BBox 6 anchor landmarks × 1.6 scale</text>
      <text x="20" y="69" class="step-desc">• Hand Norm: BBox độc lập cho từng bàn tay</text>
      <text x="20" y="86" class="step-desc">• Chuẩn hóa tọa độ về khoảng chuẩn: [-0.5, 0.5]</text>
    </g>

    <!-- Step 3.3 -->
    <g transform="translate(20, 335)">
      <rect width="315" height="75" rx="10" fill="url(#step-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="25" cy="25" r="12" fill="#047857" />
      <text x="21" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="48" y="28" class="step-title">Trực Quan Hóa &amp; Thống Kê EDA</text>
      <text x="20" y="52" class="step-desc">• Tạo video 3 panel: Body, Left Hand, Right Hand</text>
      <text x="20" y="69" class="step-desc">• Phân tích phân bố frames, lớp và kiểm tra shape</text>
    </g>

    <!-- Output Box -->
    <g transform="translate(20, 430)">
      <rect width="315" height="105" rx="10" fill="#0F172A" stroke="#059669" stroke-width="1.2" />
      <text x="16" y="26" class="step-title" fill="#34D399">Đầu Ra Giai Đoạn 3:</text>
      <text x="16" y="50" class="code-pill" fill="#34D399">keypoints/{gloss}/*.npy</text>
      <text x="16" y="70" class="step-desc">Ma trận NumPy shape: [num_frames, 76, 3]</text>
      <text x="16" y="90" class="step-desc" fill="#F8FAFC" font-weight="600">Sẵn sàng huấn luyện GCN / Transformer / LSTM</text>
    </g>
  </g>

  <!-- ==================== FOOTER BADGES ==================== -->
  <g transform="translate(50, 715)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="170" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#38BDF8" />
    <text x="28" y="21" class="badge-text">Dataset: VSL-400 (472 glosses)</text>

    <!-- Badge 2 -->
    <rect x="185" y="0" width="165" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="201" cy="17" r="4" fill="#A855F7" />
    <text x="213" y="21" class="badge-text">Video Count: ~26,600+ vids</text>

    <!-- Badge 3 -->
    <rect x="365" y="0" width="175" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="381" cy="17" r="4" fill="#34D399" />
    <text x="393" y="21" class="badge-text">Output: 76 Keypoints 3D</text>

    <!-- Badge 4 -->
    <rect x="555" y="0" width="185" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="571" cy="17" r="4" fill="#F59E0B" />
    <text x="583" y="21" class="badge-text">Resolution: 224 × 224 Square</text>

    <!-- Badge 5 -->
    <rect x="755" y="0" width="175" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="771" cy="17" r="4" fill="#EC4899" />
    <text x="783" y="21" class="badge-text">Split: Unseen-Signer 80/20</text>

    <!-- Badge 6 -->
    <rect x="945" y="0" width="205" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="961" cy="17" r="4" fill="#10B981" />
    <text x="973" y="21" class="badge-text">Format: NumPy .npy (float32)</text>
  </g>
</svg>
